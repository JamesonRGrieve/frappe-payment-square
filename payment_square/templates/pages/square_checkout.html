{% extends "templates/web.html" %}
{# SPDX-License-Identifier: AGPL-3.0-or-later #}

{% block title %}{{ _("Pay") }} {{ amount }}{% endblock %}

{% block page_content %}
<main class="square-checkout" style="max-width:32rem;margin:2rem auto">
	<h1 style="font-size:1.5rem">{{ title }}</h1>
	{% if description %}<p>{{ description }}</p>{% endif %}
	<p><strong>{{ _("Amount") }}:</strong> {{ amount }}</p>
	<form id="square-payment-form" novalidate>
		<label for="card-container" style="display:block;margin-bottom:.5rem">{{ _("Card details") }}</label>
		<div id="card-container" role="group" aria-label="{{ _('Card details') }}"></div>
		<p id="payment-status" role="status" aria-live="polite" style="min-height:1.5rem"></p>
		<button id="pay-button" type="submit" class="btn btn-primary" disabled>{{ _("Pay") }} {{ amount }}</button>
	</form>
</main>
<script src="{{ sdk_url }}"></script>
<script>
(async () => {
	const statusEl = document.getElementById("payment-status");
	const button = document.getElementById("pay-button");
	const say = (message) => { statusEl.textContent = message; };
	let card;
	try {
		const payments = window.Square.payments({{ application_id | tojson }}, {{ location_id | tojson }});
		card = await payments.card();
		await card.attach("#card-container");
		button.disabled = false;
	} catch (e) {
		say({{ _("Card payments are unavailable right now. Please try again later.") | tojson }});
		return;
	}
	document.getElementById("square-payment-form").addEventListener("submit", async (event) => {
		event.preventDefault();
		button.disabled = true;
		say({{ _("Processing…") | tojson }});
		const result = await card.tokenize();
		if (result.status !== "OK") {
			say({{ _("Please check your card details and try again.") | tojson }});
			button.disabled = false;
			return;
		}
		frappe.call({
			method: "payment_square.api.make_payment",
			args: { payment_request: {{ payment_request | tojson }}, source_id: result.token },
			freeze: true,
			callback: (r) => { window.location.href = "/" + r.message.redirect_to.replace(/^\//, ""); },
			error: () => { say({{ _("The payment could not be completed. You have not been charged.") | tojson }}); button.disabled = false; },
		});
	});
})();
</script>
{% endblock %}
